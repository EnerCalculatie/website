    <!-- Google Tag Manager — uitgesteld geladen: gtm.js is 70+ KB ongebruikte JS

         klaar; het script zelf laadt bij eerste interactie of kort na window.load,
         wat het eerst gebeurt. Pageviews en events blijven gewoon binnenkomen. -->
    <script>
    window.dataLayer = window.dataLayer || [];
    window.dataLayer.push({'gtm.start': new Date().getTime(), event: 'gtm.js'});
    (function () {
      var loaded = false;
      function loadGtm() {
        if (loaded) return;
        loaded = true;
        var j = document.createElement('script');
        j.async = true;
        j.src = 'https://www.googletagmanager.com/gtm.js?id=GTM-5584TTFK';
        document.head.appendChild(j);
      }
      ['pointerdown', 'keydown', 'touchstart', 'scroll'].forEach(function (evt) {
        window.addEventListener(evt, loadGtm, { once: true, passive: true });
      });
      if (document.readyState === 'complete') {
        setTimeout(loadGtm, 1500);
      } else {
        window.addEventListener('load', function () { setTimeout(loadGtm, 1500); });
      }
    })();
    </script>
    <!-- End Google Tag Manager -->
