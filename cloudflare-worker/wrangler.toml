name = "enercalculatie-forms"
main = "index.js"
compatibility_date = "2026-09-03"

# Front controller voor de hele site: elk request op het domein loopt door
# deze Worker (formulieren/health direct afgehandeld, de rest doorgezet naar
# GitHub Pages met securityheaders + legacy-redirects + Umami-proxy erbovenop
# — zie index.js). Cloudflare zit al als proxy vóór GH Pages (cf-ray/x-served-by
# op elk live request), dus dit vervangt geen DNS, alleen de routing ertussen.
[[routes]]
pattern = "www.enercalculatie.nl/*"
zone_name = "enercalculatie.nl"

[[routes]]
pattern = "enercalculatie.nl/*"
zone_name = "enercalculatie.nl"

[[kv_namespaces]]
binding = "FORM_RATE_LIMIT"
id = "3dcf3536655c49f3b06adadf7950b0ac"

# Secrets zetten:
#   wrangler secret put RESEND_API_KEY
#   wrangler secret put BREVO_API_KEY
#   wrangler secret put BREVO_LIST_ID
#   wrangler secret put BREVO_TEMPLATE_ID
