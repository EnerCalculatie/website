name: Kennisbank-artikel (di/do)

# Evidence-based SEO/GEO content engine-pipeline:
# 1. Cronjob start (of handmatig via workflow_dispatch)
# 2. ai-context/*.md wordt gelezen door plan-content.mjs en generate-blog-post.mjs
# 3. Onderwerp gekozen: hoogste-prioriteit 'planned' item uit ai-context/content-plan.json
# 4. Artikel gegenereerd via Gemini (generate-blog-post.mjs), incl. verplichte
#    claims-array die elke feitelijke claim aan een sourceKey uit
#    ai-context/trusted-sources.json koppelt
# 5. SEO/GEO-controle (seo-geo-validator.mjs) — score < 80 op SEO of GEO triggert
#    één automatische verbeterpoging, daarna definitieve afkeuring
# 6. Fact-check: elke claim wordt getoetst tegen live gefetchte brontekst van de
#    opgegeven bron (claim-extractor/source-validator/fact-check.mjs). Één claim
#    die niet SUPPORTED is, triggert een zelfherstel-poging (max 3), daarna
#    definitieve afkeuring — correctheid boven publicatiefrequentie
# 7. Zelfherstel zit in stap 5/6 (self-correcting binnen hetzelfde script-proces)
# 8. Commit naar main (alleen bij goedgekeurd + fact-checked artikel;
#    content-plan/content-log worden altijd gecommit, ook bij afkeuring, voor
#    zichtbare geschiedenis)
# 9. Deploy — Railway deployt automatisch bij push naar main (buiten deze workflow)
on:
  schedule:
    # 05:00 UTC = 06:00 CET (winter) / 07:00 CEST (zomer).
    # GitHub Actions cron kent geen tijdzones/DST; pas aan als 06:00 lokale tijd
    # het hele jaar exact nodig is (bv. twee cronregels, zomer/winter).
    # 2 = dinsdag, 4 = donderdag.
    - cron: '0 5 * * 2,4'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: "1. Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: "2-3. Lees ai-context en vul content-backlog aan"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: node scripts/plan-content.mjs

      - name: "4-7. Genereer artikel, claim-extractie, bronverificatie, fact-check, self-herstel en SEO/GEO"
        id: generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: node scripts/generate-blog-post.mjs

      # Gate tussen AI-output en productie. De push gaat direct naar main en
      # Railway deployt daarop, dus een fout die hier doorglipt staat live.
      # Draait dezelfde checks als ci.yml, maar vóór de push i.p.v. erna.
      - name: "6b. QC — typecheck, build en SEO-QC op het nieuwe artikel"
        id: qc
        if: steps.generate.outcome == 'success'
        continue-on-error: true
        run: |
          npm run typecheck
          npm run lint
          npm run build
          npm run qc:seo

      # Faalt de generatie óf de QC, dan draaien we de artikelbestanden terug en
      # publiceren we niets. content-plan/content-log gaan wél mee: die leggen de
      # afkeuring vast, zodat het onderwerp opnieuw geprobeerd kan worden.
      #
      # Let op de generate-tak: stap 7 committeert met `if: always()` wat er op
      # schijf staat. Een generate die halverwege afbreekt (bv. build stuk op een
      # niet-geëscapete tag) laat kapotte bestanden achter, en die gingen zo
      # ongecontroleerd naar main — precies wat er op 15-07-2026 gebeurde.
      - name: "6c. Artikelbestanden terugdraaien bij gefaalde generatie of QC"
        if: steps.generate.outcome != 'success' || steps.qc.outcome != 'success'
        run: |
          echo "::error::Generatie of QC gefaald — artikel wordt niet gepubliceerd. Zie stap 4-6 en 6b."
          git checkout -- src/components/blog src/content/blogPosts.ts src/App.tsx || true
          git clean -fd src/components/blog

      - name: "7. Commit en push (main → Railway deployt automatisch)"
        id: push
        if: always()
        run: |
          git config user.name "enercalculatie-bot"
          git config user.email "bot@enercalculatie.nl"
          git add src/components/blog src/content/blogPosts.ts src/App.tsx ai-context/content-plan.json ai-context/content-log.json
          # article-audit.json bestaat alleen na een volledig geslaagde run (fact-check +
          # SEO/GEO beide goedgekeurd) — los toevoegen, anders faalt `git add` hard op een
          # niet-bestaand pad en breekt de hele commit-stap, óók bij een normale afkeuring.
          if [ -f ai-context/article-audit.json ]; then
            git add ai-context/article-audit.json
          fi
          if git diff --cached --quiet; then
            echo "Geen wijzigingen om te committen."
            exit 0
          fi
          SLUG=$(git diff --cached src/content/blogPosts.ts | grep -oP "^\+\s*slug: '\K[^']+" | tail -1)
          if [ -n "$SLUG" ]; then
            git commit -m "feat: kennisbank-artikel toevoegen - ${SLUG}"
            echo "slug=${SLUG}" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: content-backlog/log bijgewerkt (geen nieuw artikel)"
          fi
          git push origin HEAD:main

      # IndexNow meldt de nieuwe URL direct aan bij Bing/Yandex, i.p.v. te wachten
      # tot ze de sitemap opnieuw ophalen. Het script wacht zelf tot het
      # sleutelbestand live staat, zodat de Railway-deploy de tijd krijgt.
      # Faalt dit, dan is dat geen reden de run rood te maken: het artikel staat
      # dan al gepubliceerd en wordt alsnog via de sitemap opgepikt.
      - name: "8. IndexNow — nieuwe URL aanmelden"
        if: steps.push.outputs.slug != ''
        continue-on-error: true
        run: node scripts/indexnow-submit.mjs "/blog/${{ steps.push.outputs.slug }}"

      - name: Samenvatting
        if: always()
        run: |
          echo "## Kennisbank-generator — resultaat" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.generate.outcome }}" != "success" ]; then
            echo "**Status:** mislukt of artikel afgekeurd — zie logs van stap 4-6 hierboven" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.qc.outcome }}" != "success" ]; then
            echo "**Status:** artikel gegenereerd maar QC gefaald — niet gepubliceerd, zie stap 6b" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Status:** geslaagd" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Laatste entry in ai-context/content-log.json:" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          node -e "const l=require('./ai-context/content-log.json'); console.log(JSON.stringify(l.at(-1) ?? {note:'geen log-entry'}, null, 2))" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
