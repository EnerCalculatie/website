name: Kennisbank-artikel (di/do)

# Multi-agent content-engine-pipeline (scripts/content-engine/, TypeScript):
# 1. Cronjob start (of handmatig via workflow_dispatch)
# 2. plan-content.mjs vult ai-context/content-plan.json aan als er te weinig
#    'planned' items over zijn (via Gemini, apart van de artikel-pipeline zelf)
# 3. run-pipeline.ts kiest het hoogste-prioriteit 'planned' item uit
#    ai-context/content-plan.json (of een expliciet meegegeven onderwerp)
# 4. ResearchAgent verzamelt feiten, WriterAgent schrijft het artikel — uitsluitend
#    op basis van de statische kennisbank (scripts/content-engine/knowledge/*.md)
#    en de researchfeiten; mag niets verzinnen buiten die bronnen
# 5. Kwaliteitsloop (max 2 herschrijf-iteraties): FactCheckerAgent +
#    TechnicalReviewerAgent beoordelen het concept, blokkerende issues gaan als
#    feedback terug naar WriterAgent
# 6. SeoGeoAgent optimaliseert (title/meta/slug/FAQ), QualityGateAgent geeft het
#    definitieve oordeel (passed/confidence) — alleen high-severity issues blokkeren
#    publicatie na alle iteraties
# 7. PublishAgent schrijft het React-component, werkt blogPosts.ts/App.tsx bij en
#    verifieert de build (vite build + prerender) vóór er iets gecommit wordt
# 8. Commit naar main (content-plan/content-log worden altijd gecommit, ook bij
#    afkeuring, voor zichtbare geschiedenis)
# 9. GitHub Pages wordt expliciet aangeroepen na een geslaagde run met een nieuw artikel.
# 10-11. Bij een nieuw artikel (slug bekend): generate-social.mjs zet het artikel om
#    in 3 LinkedIn-posts (scripts/generate-social.mjs, Gemini) en commit dat apart naar
#    src/content/social/. continue-on-error: mislukt de repurposing (bv. safety-filter,
#    rate limit), dan blijft het artikel zelf gewoon gepubliceerd.
#
# scripts/lib/claim-extractor.mjs en scripts/lib/source-validator.mjs worden
# NIET door deze workflow aangeroepen (wel door het losse scripts/backfill-sources.mjs)
# — nog niet opgeruimd/samengevoegd, zie audit 2026-08-07. scripts/lib/fact-check.mjs
# wordt WEL actief gebruikt door de huidige pipeline (FactCheckerAgent.ts,
# QualityGateAgent.ts) — stond hier eerder ten onrechte als ongebruikt vermeld
# (gecorrigeerd 2026-08-09). generate-blog-post.mjs en seo-geo-validator.mjs
# bestaan niet meer in de repo.
on:
  schedule:
    # Dinsdag en donderdag vanaf 06:00 Europe/Amsterdam, met inhaalmomenten.
    # GitHub Actions cron kent geen tijdzones (04:00 UTC = 06:00 CEST, 05:00 UTC =
    # 06:00 CET) en start geplande runs onder piekbelasting uren te laat — of laat
    # ze soms helemaal vallen. Bovendien kan de gratis Gemini-tier een ochtend lang
    # overbelast zijn (503's op 29-09, 30-09 en 01-10-2026). Daarom meerdere
    # triggers over de dag; de guard-stap hieronder laat er precies één een artikel
    # publiceren: de eerste die na 06:00 lokale tijd draait zolang er die dag nog
    # geen artikel staat. Latere triggers stoppen zichzelf dan binnen seconden.
    - cron: '0 4,5,7,9,11,13 * * 2,4'
  workflow_dispatch:
    inputs:
      force:
        description: "Publiceer ook buiten dinsdag/donderdag (bv. voor een test-run). Standaard uit — de dag-check geldt anders ook bij handmatige runs."
        type: boolean
        default: false
      topic:
        description: "Optioneel: expliciet onderwerp i.p.v. het automatisch gekozen backlog-item (bv. om een bestaand artikel opnieuw te genereren voor handmatige review — de slug-collision-guard in PublishAgent blokkeert de automatische publicatie dan alsnog terecht; gebruik dit om de seo-optimized.json-artifact te produceren en handmatig toe te passen)."
        type: string
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: blog-content-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    permissions:
      contents: write
    outputs:
      slug: ${{ steps.push.outputs.slug }}
      commit: ${{ steps.push.outputs.commit }}
    runs-on: ubuntu-latest
    # Worst case (veel 503-retries + modelfallback) duurt een run lang; nooit uren laten hangen.
    timeout-minutes: 120
    steps:
      - name: "0. Checkout"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "1. Alleen di/do na 06:00 Europe/Amsterdam, max. één artikel per dag"
        id: guard
        run: |
          # Handmatige uitzondering (bv. een test-run): force=true slaat alle checks over.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "Handmatige run met force=true — checks overgeslagen."
            exit 0
          fi

          # Dag-check geldt voor cron én handmatige runs (bugfix 2026-09-02).
          DAY=$(TZ=Europe/Amsterdam date +%u)  # 1=maandag .. 7=zondag
          echo "Lokale tijd (Europe/Amsterdam): $(TZ=Europe/Amsterdam date)"
          if [ "$DAY" != "2" ] && [ "$DAY" != "4" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Geen dinsdag of donderdag (dag=$DAY) — overgeslagen. Gebruik force=true voor een bewuste uitzondering."
            exit 0
          fi

          # Geen kloktijd van de trigger vergelijken (runs starten vaak uren te laat),
          # alleen: niet vóór 06:00 lokaal. Dekt meteen zomer-/wintertijd af.
          HOUR=$(TZ=Europe/Amsterdam date +%H)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$((10#$HOUR))" -lt 6 ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Nog geen 06:00 lokale tijd (uur=$HOUR) — overgeslagen."
            exit 0
          fi

          # Vandaag al een artikel gepubliceerd (door een eerdere trigger)? Dan klaar.
          SINCE=$(TZ=Europe/Amsterdam date +%FT00:00:00%z)
          DONE=$(git log -1 --since="$SINCE" --grep='^feat: kennisbank-artikel' --format=%h)
          if [ -n "$DONE" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Vandaag al gepubliceerd ($DONE) — overgeslagen."
            exit 0
          fi

          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        if: steps.guard.outputs.proceed == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.guard.outputs.proceed == 'true'
        run: npm ci

      # Alle Gemini-stappen gebruiken uitsluitend de gratis key, zonder paid-fallback.
      - name: "2-3. Lees ai-context en vul content-backlog aan"
        if: steps.guard.outputs.proceed == 'true'
        env:
          GEMINI_TIER: free
          GEMINI_API_KEY_FREE: ${{ secrets.GEMINI_API_KEY_FREE || secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: node scripts/plan-content.mjs

      - name: "4-7. Multi-Agent Pipeline (Research, Write, Review, SEO, Publish)"
        id: generate
        if: steps.guard.outputs.proceed == 'true'
        env:
          GEMINI_TIER: free
          GEMINI_API_KEY_FREE: ${{ secrets.GEMINI_API_KEY_FREE || secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          TOPIC_OVERRIDE: ${{ github.event.inputs.topic }}
        run: npx tsx scripts/content-engine/run-pipeline.ts "$TOPIC_OVERRIDE"

      - name: "7b. Pipeline-debugbestanden als CI-artifact bewaren (i.p.v. committen)"
        if: always() && steps.guard.outputs.proceed == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-debug-${{ github.run_id }}
          path: |
            seo-brief.json
            research.json
            draft.md
            draft.extras.json
            fact-check.json
            technical-review.json
            seo-optimized.json
            seo-audit.json
            marketing-report.json
            quality-report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: "8. Commit en push artikel"
        id: push
        if: always() && steps.guard.outputs.proceed == 'true'
        run: |
          git config user.name "enercalculatie-bot"
          git config user.email "bot@enercalculatie.nl"
          git add src/components/blog src/content/blogPosts.ts src/App.tsx ai-context/content-plan.json ai-context/content-log.json
          if git diff --cached --quiet; then
            echo "Geen wijzigingen om te committen."
            exit 0
          fi
          SLUG=$(git diff --cached src/content/blogPosts.ts | grep -oP "^\+\s*slug: '\K[^']+" | tail -1)
          if [ -n "$SLUG" ]; then
            git commit -m "feat: kennisbank-artikel toevoegen via pipeline - ${SLUG}"
            echo "slug=${SLUG}" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: content-backlog/log bijgewerkt (geen nieuw artikel)"
          fi
          # Main kan intussen bewogen zijn (handmatige push) — rebase i.p.v. een geweigerde push.
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: "9. IndexNow — nieuwe URL aanmelden"
        if: steps.push.outputs.slug != ''
        continue-on-error: true
        run: node scripts/indexnow-submit.mjs "/blog/${{ steps.push.outputs.slug }}"

      - name: "10. LinkedIn-repurposing genereren"
        id: social
        if: steps.push.outputs.slug != ''
        continue-on-error: true
        env:
          GEMINI_TIER: free
          GEMINI_API_KEY_FREE: ${{ secrets.GEMINI_API_KEY_FREE || secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: node scripts/generate-social.mjs "${{ steps.push.outputs.slug }}"

      - name: "11. Commit en push LinkedIn-repurposing"
        if: steps.social.outcome == 'success'
        run: |
          git config user.name "enercalculatie-bot"
          git config user.email "bot@enercalculatie.nl"
          git add src/content/social
          if git diff --cached --quiet; then
            echo "Geen social-bestand om te committen."
            exit 0
          fi
          git commit -m "chore: LinkedIn-repurposing voor ${{ steps.push.outputs.slug }}"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}

      - name: Samenvatting
        if: always()
        run: |
          echo "## Kennisbank-generator — resultaat" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.guard.outputs.proceed }}" != "true" ]; then
            echo "**Status:** overgeslagen — geen publicatiedag, vóór 06:00 of vandaag al gepubliceerd." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.generate.outcome }}" != "success" ]; then
            echo "**Status:** mislukt of afgekeurd door Quality Gate" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.push.outcome }}" != "success" ]; then
            echo "**Status:** opslaan op GitHub mislukt" >> "$GITHUB_STEP_SUMMARY"
          elif [ -z "${{ steps.push.outputs.slug }}" ]; then
            echo "**Status:** geen nieuw artikel, geen websitepublicatie nodig" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Status:** artikel opgeslagen; zie de Pages-job voor de websitepublicatie" >> "$GITHUB_STEP_SUMMARY"
          fi

  publish-website:
    needs: generate
    if: github.ref == 'refs/heads/main' && needs.generate.outputs.slug != ''
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.generate.outputs.commit }}
