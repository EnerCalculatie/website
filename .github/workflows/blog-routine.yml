name: Blog Installatiebranche (Ma-Vr 06:00)

on:
  schedule:
    - cron: '0 4 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-blog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Genereer Blog Artikel
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: node scripts/generate-blog.js

      - name: Maak Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat(blog): nieuw kennisbank artikel installatiebranche"
          title: "Automatisch gegenereerd blogartikel"
          branch: "auto-blog-${{ github.run_id }}"
          body: "Dit artikel is automatisch gegenereerd door de workflow. Controleer de inhoud voor je merget."
